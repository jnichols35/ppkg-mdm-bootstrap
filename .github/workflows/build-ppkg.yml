name: Build PPKG

# Manual builds only for now - re-add the push trigger to restore automatic
# builds when committing to main:
# on:
#   push:
#     branches: [ main ]
on:
  workflow_dispatch:

# Required by softprops/action-gh-release to create releases
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version
      id: get_version
      run: |
        $ErrorActionPreference = 'Continue'
        
        # Try to get the latest tag
        $gitOutput = git describe --tags --abbrev=0 2>&1
        $version = if ($LASTEXITCODE -eq 0) {
            try {
                $v = [Version]$gitOutput
                "{0}.{1}.{2}" -f $v.Major, $v.Minor, ($v.Build + 1)
            } catch {
                Write-Host "Invalid version format in tag, defaulting to 0.0.1"
                "0.0.1"
            }
        } else {
            Write-Host "No existing tags found. Starting with 0.0.1"
            "0.0.1"
        }
        
        Write-Host "Setting version to: $version"
        "version=$version" >> $env:GITHUB_OUTPUT
        exit 0
      shell: pwsh

    - name: Build PPKG
      run: .\scripts\create-ppkg.ps1
      shell: pwsh
      env:
        REMOTE_SCRIPT_URL: ${{ vars.REMOTE_SCRIPT_URL }}

    - name: Create Release
      id: create_release
      # softprops/action-gh-release pinned to v3.0.4 for supply-chain safety
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        files: |
          output/DeviceSetup.ppkg
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
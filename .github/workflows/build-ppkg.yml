name: Build PPKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version
      id: get_version
      run: |
        try {
            $currentTag = $(git describe --tags --abbrev=0 2>&1)
            if ($LASTEXITCODE -eq 0) {
                $version = [Version]$currentTag
                $version = "{0}.{1}.{2}" -f $version.Major, $version.Minor, ($version.Build + 1)
            } else {
                Write-Host "No existing tags found. Starting with 0.0.1"
                $version = "0.0.1"
            }
        } catch {
            Write-Host "Error getting version, defaulting to 0.0.1"
            $version = "0.0.1"
        }
        "version=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Setting version to: $version"
      shell: pwsh

    - name: Build PPKG
      run: .\scripts\create-ppkg.ps1
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        files: |
          output/DeviceSetup.ppkg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
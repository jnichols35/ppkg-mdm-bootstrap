name: Build PPKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version
      id: get_version
      run: |
        $ErrorActionPreference = 'Continue'
        
        # Try to get the latest tag
        $gitOutput = git describe --tags --abbrev=0 2>&1
        $version = if ($LASTEXITCODE -eq 0) {
            try {
                $v = [Version]$gitOutput
                "{0}.{1}.{2}" -f $v.Major, $v.Minor, ($v.Build + 1)
            } catch {
                Write-Host "Invalid version format in tag, defaulting to 0.0.1"
                "0.0.1"
            }
        } else {
            Write-Host "No existing tags found. Starting with 0.0.1"
            "0.0.1"
        }
        
        Write-Host "Setting version to: $version"
        "version=$version" >> $env:GITHUB_OUTPUT
        exit 0
      shell: pwsh

    - name: Build PPKG
      run: .\scripts\create-ppkg.ps1
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        files: |
          output/DeviceSetup.ppkg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 